{% extends "base.html" %}
{% block content %}
<div class="grid-layout-single">
  <section class="card cyber-card upload-card">
    <div class="card-head"><h3>Upload an Email (.eml)</h3></div>
    <div class="card-body">
      <form id="uploadForm" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
        <div class="dropzone" id="dropzone" style="position:relative;">
          <input id="fileInput" name="file" type="file" accept=".eml"
                 style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;z-index:10;cursor:pointer;">
          <div class="drop-inner" style="pointer-events:none;">
            <div class="upload-ico">📧</div>
            <div class="upload-text"><strong>Drop .eml file here</strong><div class="muted">or click to choose</div></div>
            <div id="fileName" class="file-name muted"></div>
          </div>
        </div>

        <div class="actions">
          <button id="classifyBtn" type="submit" class="btn neon-btn" disabled>Classify Email</button>
          <button id="resetBtn" type="button" class="btn btn-ghost">Reset</button>
        </div>
      </form>
    </div>
  </section>
</div>

<div id="overlay" class="overlay hidden">
  <div class="loader">
    <div class="spinner"></div>
    <div class="loader-text">Analyzing &ndash; Neural nets warming up</div>
  </div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const classifyBtn = document.getElementById("classifyBtn");
const fileNameDisplay = document.getElementById("fileName");
const uploadForm = document.getElementById("uploadForm");

fileInput.addEventListener("change", () => {
    if(fileInput.files.length > 0){
        const file = fileInput.files[0];
        const ext = file.name.split('.').pop().toLowerCase();
        if(ext === "eml"){
            classifyBtn.disabled = false;
            fileNameDisplay.textContent = file.name;
        } else {
            classifyBtn.disabled = true;
            alert("Please select a valid .eml file!");
            fileInput.value = "";
            fileNameDisplay.textContent = "";
        }
    } else {
        classifyBtn.disabled = true;
        fileNameDisplay.textContent = "";
    }
});

// prevent submit if no file
uploadForm.addEventListener("submit", (e) => {
    if(fileInput.files.length === 0){
        e.preventDefault();
        alert("Please select a .eml file before submitting!");
    }
});

// Reset button
document.getElementById("resetBtn").addEventListener("click", () => {
    fileInput.value = "";
    fileNameDisplay.textContent = "";
    classifyBtn.disabled = true;
});
</script>
{% endblock %}
